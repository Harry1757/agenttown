name: Windows installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: npm ci
        working-directory: app
      - run: python -m pip install PyInstaller==6.22.2
      - run: python -m unittest test_codextown -v
      - run: node --test app/test-server-command.js app/test-notifications.js
      - run: node test_town_scale.js
      - run: node test_wander.js
      - run: npm run dist:win
        working-directory: app
      - name: Check packaged server with an empty local profile
        run: python tools/check-packaged-server.py app/dist/win-unpacked/resources/backend/codextown-server.exe
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem app/dist/AgentTown-*-Setup.exe | ForEach-Object {
            $digest = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$digest  $($_.Name)" | Set-Content -Encoding ascii ($_.FullName + '.sha256')
          }
      - uses: actions/upload-artifact@v4
        with:
          name: AgentTown-Windows-x64
          path: |
            app/dist/AgentTown-*-Setup.exe
            app/dist/AgentTown-*-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 30
